name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.5.0

      - name: Setup Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build
        run: npm run build

      - name: Generated output is committed
        run: git diff --exit-code

      - name: Typecheck (CLI + report UI)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate output schemas
        run: npm run test:schemas

      - name: Fixture matrix
        run: npm run test:fixtures:all

      - name: Validate packed package
        run: npm run test:pack

      - name: Node 14 packed-package smoke test
        run: npm run test:docker:node14
